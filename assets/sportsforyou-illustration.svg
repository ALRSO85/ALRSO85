<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">SportsForYou — competição e eventos esportivos</title>
  <desc id="desc">Troféu em destaque sobre um pódio esportivo, conectado a um calendário ilustrado de eventos e modalidades.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08182b"/>
      <stop offset=".58" stop-color="#0b293b"/>
      <stop offset="1" stop-color="#10434a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#12b9d1"/>
      <stop offset="1" stop-color="#38d69c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff0a8"/>
      <stop offset=".45" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ed9141"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#15344a"/>
      <stop offset="1" stop-color="#0e2337"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#24d9c5" stop-opacity=".27"/>
      <stop offset="1" stop-color="#24d9c5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.5" height="1.6">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#background)" stroke="#267884" stroke-width="2"/>
  <circle cx="390" cy="142" r="275" fill="url(#glow)"/>
  <path d="M-20 245C137 128 272 282 430 188s251-86 399-19 230 62 417-15" fill="none" stroke="#54e2cb" stroke-opacity=".12" stroke-width="2"/>
  <path d="M-15 271C144 160 275 301 442 211s250-82 388-19 248 60 396-10" fill="none" stroke="#80e5ff" stroke-opacity=".09" stroke-width="1.5"/>
  <path d="M86 202c77-72 159-76 235-30s125 29 186-22 105-62 161-39" fill="none" stroke="url(#teal)" stroke-opacity=".72" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>

  <g transform="translate(48 36)">
    <rect width="200" height="30" rx="15" fill="#d8fff8" fill-opacity=".1" stroke="#8be9dc" stroke-opacity=".32"/>
    <circle cx="17" cy="15" r="5" fill="#42ddb4"/>
    <text x="31" y="20" fill="#e7fffc" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SPORTS FOR YOU</text>
  </g>
  <text x="50" y="91" fill="#e8fffc" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.3">ENCONTRE SEU PRÓXIMO DESAFIO</text>
  <text x="50" y="113" fill="#9ec3ca" font-family="Arial, sans-serif" font-size="11" letter-spacing=".4">EVENTOS · MODALIDADES · COMUNIDADES</text>

  <g filter="url(#shadow)">
    <!-- pódio -->
    <path d="M102 215h137v45H102z" fill="#126b7d" stroke="#3dc7cd" stroke-width="2"/>
    <path d="M239 188h159v72H239z" fill="url(#teal)" stroke="#86fff0" stroke-width="2"/>
    <path d="M398 218h112v42H398z" fill="#10596d" stroke="#38aeba" stroke-width="2"/>
    <path d="M102 215h137v7H102zm137-27h159v7H239zm159 30h112v7H398z" fill="#8af6e6" fill-opacity=".55"/>
    <text x="160" y="246" fill="#d7fffb" font-family="Arial, sans-serif" font-size="20" font-weight="800">2</text>
    <text x="302" y="239" fill="#073441" font-family="Arial, sans-serif" font-size="28" font-weight="800">1</text>
    <text x="445" y="249" fill="#d7fffb" font-family="Arial, sans-serif" font-size="20" font-weight="800">3</text>
    <!-- taça e alças -->
    <path d="M271 58c-4-13-21-17-31-8-9 8-8 23 2 32 8 7 16 9 25 9m102-33c4-13 21-17 31-8 9 8 8 23-2 32-8 7-16 9-25 9" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
    <path d="M269 50h110l-10 64c-4 27-22 45-45 50-23-5-41-23-45-50z" fill="url(#gold)" stroke="#fff2b9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M281 63h86l-8 47c-4 19-16 31-35 37-19-6-31-18-35-37z" fill="#ecaa4e" fill-opacity=".72"/>
    <path d="M303 89l11 22 25-27-6 31 18 7-27 1-12 24-4-25-22-9 23-4z" fill="#fff4c2"/>
    <path d="M318 163h13v26h-13z" fill="url(#gold)"/>
    <rect x="293" y="187" width="63" height="15" rx="5" fill="#f2b54d" stroke="#fff0a8" stroke-width="2"/>
  </g>

  <!-- medal and finish-line accents -->
  <path d="M91 129l21 14-9 37-23-19zm43 0-21 14 9 37 23-19z" fill="#16b7bc" fill-opacity=".8" stroke="#7df4e5" stroke-width="1.5"/>
  <circle cx="112" cy="183" r="19" fill="url(#gold)" stroke="#fff1a7" stroke-width="2"/>
  <circle cx="112" cy="183" r="12" fill="none" stroke="#a86f32" stroke-width="2"/>
  <path d="M112 174l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z" fill="#fff8d8"/>

  <!-- calendário ilustrado -->
  <g transform="translate(637 35)" filter="url(#shadow)">
    <rect width="510" height="230" rx="20" fill="url(#panel)" stroke="#76dacf" stroke-opacity=".48" stroke-width="2"/>
    <path d="M1 20A19 19 0 0 1 20 1h470a19 19 0 0 1 19 19v35H1Z" fill="#153b50"/>
    <g transform="translate(22 17)" fill="none" stroke="#8dece1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="2" width="22" height="21" rx="4"/>
      <path d="M6 0v5m12-5v5M1 9h22"/>
    </g>
    <text x="58" y="34" fill="#effffc" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7">CALENDÁRIO ESPORTIVO</text>
    <circle cx="461" cy="27" r="4" fill="#39d7a3"/>
    <circle cx="477" cy="27" r="4" fill="#61dbea" fill-opacity=".75"/>

    <g transform="translate(22 69)" font-family="Arial, sans-serif">
      <rect width="137" height="30" rx="15" fill="#1d5060" stroke="#51d7c8" stroke-opacity=".65"/>
      <text x="14" y="20" fill="#d9fffa" font-size="10" font-weight="700">MODALIDADE</text>
      <path d="m118 12 5 5 5-5" fill="none" stroke="#8dece1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="148" width="104" height="30" rx="15" fill="#1d5060" stroke="#51d7c8" stroke-opacity=".65"/>
      <text x="165" y="20" fill="#d9fffa" font-size="10" font-weight="700">REGIÃO</text>
      <path d="m227 12 5 5 5-5" fill="none" stroke="#8dece1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="263" width="112" height="30" rx="15" fill="#1d5060" stroke="#51d7c8" stroke-opacity=".65"/>
      <text x="281" y="20" fill="#d9fffa" font-size="10" font-weight="700">PERÍODO</text>
      <path d="m350 12 5 5 5-5" fill="none" stroke="#8dece1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(22 117)">
      <rect width="466" height="48" rx="12" fill="#f2fbfa"/>
      <rect x="12" y="9" width="31" height="30" rx="9" fill="#d9f7ef"/>
      <path d="M19 31c2-8 7-13 13-16m-11 7 9 2m-4-8 2 9" fill="none" stroke="#119e92" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="22" fill="#183448" font-family="Arial, sans-serif" font-size="12" font-weight="700">Eventos para acompanhar</text>
      <text x="55" y="37" fill="#547080" font-family="Arial, sans-serif" font-size="10">Datas, locais e fontes consultadas</text>
      <rect x="376" y="13" width="76" height="22" rx="11" fill="#d9f7ef"/>
      <text x="388" y="28" fill="#0c817a" font-family="Arial, sans-serif" font-size="9" font-weight="700">VER EVENTOS</text>
    </g>
    <g transform="translate(22 175)">
      <rect width="466" height="37" rx="11" fill="#122d42" stroke="#31596a"/>
      <circle cx="28" cy="18.5" r="10" fill="#193e50" stroke="#54d9cc" stroke-width="1.5"/>
      <path d="M24 21c2-6 6-8 9-8m-10 5 7 2m-3-7 2 7" fill="none" stroke="#8df3df" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M51 18h129" stroke="#c2f2ed" stroke-opacity=".82" stroke-width="5" stroke-linecap="round"/>
      <path d="M51 28h83" stroke="#79a6b0" stroke-opacity=".62" stroke-width="3" stroke-linecap="round"/>
      <rect x="378" y="8" width="74" height="21" rx="10.5" fill="#154c4b"/>
      <circle cx="390" cy="18.5" r="3" fill="#43d5a7"/>
      <path d="M401 18h36" stroke="#97f1d9" stroke-opacity=".9" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
