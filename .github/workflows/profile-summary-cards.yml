name: GitHub Profile Summary Cards

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/profile-summary-cards.yml
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub profile summary cards

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned to an immutable commit

      - name: Generate profile cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f # release branch, pinned to an immutable commit
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || github.token }}
        with:
          USERNAME: ALRSO85
          BRANCH_NAME: main
          UTC_OFFSET: -3
          AUTO_PUSH: true
          # Generate all themes so the README can adapt to GitHub's light/dark setting.
          THEME: ""
          ANIMATION: ""
          DURATION: ""
          NAME: "Alexandre Souza"
